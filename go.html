<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Redirecting...</title></head>
<body><p id="status">Redirecting...</p>
<script src="config.js"></script>
<script>
const id=new URLSearchParams(location.search).get("id");
const target=window.REDIRECTS[id];
if(target){
  location.replace(target);
}else{
  document.getElementById("status").textContent="Redirect not found.";
}
</script>
</body></html>
