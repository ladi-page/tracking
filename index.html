<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirect Manager</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="wrap">
<h1>Redirect Manager</h1>
<p class="muted">GitHub Pages multi-URL redirect manager</p>
<div id="list"></div>
<div class="card">
<h2>Add / Edit Redirect</h2>
<label>Slug</label><input id="slug" placeholder="offer1">
<label>Destination URL</label><input id="url" placeholder="https://example.com/page">
<button onclick="save()">Save Redirect</button>
<button class="secondary" onclick="clearForm()">Clear</button>
<p id="msg"></p>
</div>
</div>
<script src="config.js"></script><script src="script.js"></script>
</body></html>
